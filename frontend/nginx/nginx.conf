# ============================================================
# frontend/nginx/nginx.conf — PR-6 hardening
# ============================================================
# This config sits inside the frontend container. It serves the React SPA and
# proxies /api/* to the Spring Boot backend service. PR-6 added:
#   * security headers (HSTS, X-Frame-Options, CSP, Referrer-Policy, X-Content-Type-Options)
#   * gzip on text resources
#   * edge rate-limit for /api/v1/auth/login + /api/v1/auth/forgot-password
#   * /nginx-health for the docker-compose healthcheck
# ============================================================

# ── Edge rate-limit zones (P6-07) ────────────────────────────
# Per-IP token buckets. The Spring filter (PR-5) is still in place as an
# in-process safety net, but THIS is the primary defence under load:
# a malicious bot is rejected at nginx level without ever reaching the JVM.
limit_req_zone $binary_remote_addr zone=auth_login:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_forgot:10m  rate=3r/m;

# ── gzip on text-y responses (P6-06) ─────────────────────────
gzip            on;
gzip_vary       on;
gzip_min_length 1024;
gzip_proxied    any;
gzip_comp_level 5;
gzip_types
    application/javascript
    application/json
    application/xml
    application/wasm
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml
    font/woff
    font/woff2;

server {
    listen 80;
    server_name _;

    # Serve React SPA (Arabic RTL, UTF-8)
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ── Security headers on every response (P6-05) ────────────
    # HSTS: only meaningful on HTTPS — browsers ignore on plaintext.
    # Production must terminate TLS at the platform load balancer.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options              "DENY"                              always;
    add_header X-Content-Type-Options       "nosniff"                           always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"   always;
    # CSP for the SPA: same-origin script/style, allow data: for fonts and
    # blob: for in-memory PDFs the user might preview. Tightened progressively
    # over time — start practical, ratchet later.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';"
        always;
    # Permissions-Policy: deny browser features the app doesn't use.
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=(), interest-cohort=()"
        always;

    # ── Auth endpoints — rate limited at the edge (P6-07) ────
    location = /api/v1/auth/login {
        limit_req  zone=auth_login  burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /api/v1/auth/forgot-password {
        limit_req  zone=auth_forgot  burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/api/v1/auth/forgot-password;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Catch-all /api/* → backend (P6-08: single source of truth) ──
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow large attachment uploads (50 MB hard cap on backend; +5 MB headroom).
        client_max_body_size 55m;
        proxy_read_timeout 120s;
    }

    # Static assets — long cache + immutable for hashed Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # index.html must NEVER be cached — it points to the hashed asset bundle.
    # Without this, browsers serve a stale index.html that loads old JS, and
    # users see a previous deploy until they hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # React Router — all non-file paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Health check endpoint (used by Docker healthcheck on the frontend)
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
