# ============================================================
# docker-compose.demo.yml
# Demo deployment: PostgreSQL + Spring Boot backend + Nginx/React frontend
#
# Usage:
#   cp .env.demo.example .env.demo
#   docker compose -f docker-compose.demo.yml --env-file .env.demo up -d
# ============================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sla_demo}
      POSTGRES_USER: ${DB_USER:-sla}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sla} -d ${DB_NAME:-sla_demo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-sla_demo}
      DB_USER: ${DB_USER:-sla}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SLA_JWT_SECRET: ${SLA_JWT_SECRET:?SLA_JWT_SECRET is required}
      SLA_BOOTSTRAP_ADMIN_ENABLED: "true"
      SLA_BOOTSTRAP_ADMIN_PASSWORD: ${SLA_BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe!2026}
      # P8b-01 / D-050: opt-in to the V20–V23 dev-user seed runner.
      # Demo only — must NOT be set in production (default is false).
      SLA_DEV_SEED_ENABLED: "true"
      # E2E sweep-friendly: 10/min/IP login cap blocks the 23-login customer-feedback
      # validation spec. Override via .env.demo (commit untouched).
      SLA_SECURITY_RATE_LIMIT_ENABLED: "${SLA_SECURITY_RATE_LIMIT_ENABLED:-true}"
      SLA_CORS_ALLOWED_ORIGINS: ${SLA_CORS_ALLOWED_ORIGINS:-}
      SLA_ATTACHMENTS_BASE_DIR: /app/attachments-data
      SERVER_PORT: 8080
    volumes:
      - attachments-data:/app/attachments-data
    expose:
      - "8080"
    ports:
      - "8080:8080"
    healthcheck:
      # PR-5: switched to Actuator's liveness probe — UP only when JVM is healthy
      # (lighter + more semantically correct than hitting OpenAPI docs).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Nginx + React Frontend ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # P6-12: don't start frontend until backend is fully healthy. Avoids the
    # "white page on first hit because /api proxies to a not-yet-listening
    # backend" race that bit demo bring-ups.
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${DEMO_PORT:-80}:80"
    # P6-11: nginx-level healthcheck so docker / orchestrators can route
    # traffic only to a frontend that's actually serving.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
    name: sla-demo-db
  attachments-data:
    name: sla-demo-attachments