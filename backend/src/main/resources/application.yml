spring:
  application:
    name: state-litigation-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sla}
    username: ${DB_USER:sla}
    password: ${DB_PASSWORD:sla}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

sla:
  attachments:
    base-dir: ${SLA_ATTACHMENTS_BASE_DIR:./attachments-data}
  security:
    jwt:
      # Base64-encoded HMAC-SHA256 key (>= 32 bytes). Override in production.
      secret: ${SLA_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS0zMmJ5dGVzLW1pbi0xMjM0NTY3ODkw}
      access-token-ttl-minutes: 30
      refresh-token-ttl-days: 14
      issuer: sla-backend
    # P1-11: comma-separated list of CORS-allowed origins. Empty = same-origin
    # only via the nginx /api proxy (the recommended demo / pilot setup).
    # Production sets SLA_CORS_ALLOWED_ORIGINS=https://app.example.org explicitly.
    cors:
      allowed-origins: ${SLA_CORS_ALLOWED_ORIGINS:}
  otp:
    ttl-minutes: 10
    length: 6
    max-attempts: 5
  bootstrap:
    central-supervisor:
      enabled: ${SLA_BOOTSTRAP_ADMIN_ENABLED:true}
      username: admin
      full-name: "رئيس ادارة قضايا الدولة"
      mobile-number: "0940558967"
      # Client feedback: the demo password is `samhar_rr` (see V35 migration,
      # which also re-stamps existing demo accounts). Production MUST override
      # SLA_BOOTSTRAP_ADMIN_PASSWORD with a real secret.
      initial-password: ${SLA_BOOTSTRAP_ADMIN_PASSWORD:samhar_rr}
  # P8b-01: re-applies V20–V23 dev seeds at boot, after admin is created.
  # SECURE-BY-DEFAULT: disabled unless explicitly turned on. Demo deployments
  # set SLA_DEV_SEED_ENABLED=true (see docker-compose.demo.yml). Production
  # MUST leave this false — otherwise the V20 SQL would create dev users
  # (head_dam, section_fi_dam, …) with the admin's password hash.
  dev-seed:
    enabled: ${SLA_DEV_SEED_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# PR-5: Spring Boot Actuator — only health endpoints exposed; sensitive details hidden.
# Liveness probe = the JVM is up; Readiness probe = JVM up + DB reachable.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  level:
    sy.gov.sla: INFO
    sy.gov.sla.USER_ACTION: INFO
  pattern:
    # Compact pattern with MDC user info so every line shows who is acting.
    # UserActionLog messages also self-identify the user, so this is complementary.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [user=%X{username:-anon}] %logger{24} - %msg%n"

