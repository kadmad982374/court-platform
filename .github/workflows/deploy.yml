# =============================================================================
# Deploy court-platform to Hetzner VM (Docker Compose)
#
# Pipeline:
#   1. test           — backend (mvn -B verify, JaCoCo gates) + frontend
#                       (npm ci, vitest coverage, vite build)
#   2. build-deploy   — build linux/amd64 images for backend and frontend,
#                       push to Docker Hub
#                       (fadidasus/court-platform-backend,
#                        fadidasus/court-platform-frontend),
#                       SSH to VM, bump BACKEND_IMAGE_TAG and
#                       FRONTEND_IMAGE_TAG in /srv/court-platform/.env,
#                       roll backend + frontend containers,
#                       wait until healthy.
#
# Required GitHub Secrets:
#   SSH_KEY            — private OpenSSH key for VM user `fadi`
#   IP_ADDRESS         — Hetzner VM IPv4 (no scheme, no port)
#   DOCKERHUB_USERNAME — fadidasus
#   DOCKERHUB_TOKEN    — Docker Hub access token with write:read on
#                        fadidasus/court-platform-backend and
#                        fadidasus/court-platform-frontend
#
# Tag scheme:
#   court-platform-backend-1.0.<run_number>-<short_sha>
#   court-platform-frontend-1.0.<run_number>-<short_sha>
# Tags are immutable; rollback by editing .env back to a prior tag and
# `docker compose up -d backend frontend` on the VM.
# =============================================================================
name: Deploy court-platform

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-court-platform-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE_REPO: fadidasus/court-platform-backend
  FRONTEND_IMAGE_REPO: fadidasus/court-platform-frontend
  BACKEND_SERVICE_NAME: court-platform-backend
  FRONTEND_SERVICE_NAME: court-platform-frontend
  BACKEND_ENV_VAR_NAME: BACKEND_IMAGE_TAG
  FRONTEND_ENV_VAR_NAME: FRONTEND_IMAGE_TAG
  BACKEND_COMPOSE_SERVICE: backend
  FRONTEND_COMPOSE_SERVICE: frontend
  BACKEND_CONTAINER_NAME: court-platform-backend
  FRONTEND_CONTAINER_NAME: court-platform-frontend
  REMOTE_USER: fadi
  REMOTE_DIR: /srv/court-platform

jobs:
  test-backend:
    name: Backend test + JaCoCo gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify
        working-directory: backend
        run: mvn -B --no-transfer-progress verify

      - name: Upload surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  test-frontend:
    name: Frontend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  build-deploy:
    name: Build, push, deploy
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Compute image tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BACKEND_TAG="${BACKEND_SERVICE_NAME}-1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          FRONTEND_TAG="${FRONTEND_SERVICE_NAME}-1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "backend_tag=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${FRONTEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "Backend image:  ${BACKEND_IMAGE_REPO}:${BACKEND_TAG}"
          echo "Frontend image: ${FRONTEND_IMAGE_REPO}:${FRONTEND_TAG}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE_REPO }}:${{ steps.meta.outputs.backend_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.FRONTEND_IMAGE_REPO }}:${{ steps.meta.outputs.frontend_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          IP: ${{ secrets.IP_ADDRESS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Roll containers on VM
        env:
          NEW_BACKEND_TAG: ${{ steps.meta.outputs.backend_tag }}
          NEW_FRONTEND_TAG: ${{ steps.meta.outputs.frontend_tag }}
          IP: ${{ secrets.IP_ADDRESS }}
        run: |
          ssh -i ~/.ssh/id_deploy "${REMOTE_USER}@${IP}" \
            "set -e; cd ${REMOTE_DIR} \
             && sudo cp .env .env.\$(date +%Y%m%d-%H%M%S).bak \
             && sudo sed -i 's|^${BACKEND_ENV_VAR_NAME}=.*|${BACKEND_ENV_VAR_NAME}=${NEW_BACKEND_TAG}|' .env \
             && sudo sed -i 's|^${FRONTEND_ENV_VAR_NAME}=.*|${FRONTEND_ENV_VAR_NAME}=${NEW_FRONTEND_TAG}|' .env \
             && grep '^${BACKEND_ENV_VAR_NAME}=' .env \
             && grep '^${FRONTEND_ENV_VAR_NAME}=' .env \
             && sudo docker compose pull ${BACKEND_COMPOSE_SERVICE} ${FRONTEND_COMPOSE_SERVICE} \
             && sudo docker compose up -d ${BACKEND_COMPOSE_SERVICE} ${FRONTEND_COMPOSE_SERVICE}"

      - name: Wait for backend healthy
        env:
          IP: ${{ secrets.IP_ADDRESS }}
        run: |
          for i in $(seq 1 48); do
            STATUS=$(ssh -i ~/.ssh/id_deploy "${REMOTE_USER}@${IP}" \
              "sudo docker ps --filter name=${BACKEND_CONTAINER_NAME} --format '{{.Status}}'" || true)
            echo "Backend attempt ${i}/48 — ${STATUS:-<no status>}"
            if echo "$STATUS" | grep -q '(healthy)'; then
              echo "Backend healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not reach (healthy) within 4 minutes."
          ssh -i ~/.ssh/id_deploy "${REMOTE_USER}@${IP}" \
            "sudo docker logs --tail 80 ${BACKEND_CONTAINER_NAME}" || true
          exit 1

      - name: Wait for frontend healthy
        env:
          IP: ${{ secrets.IP_ADDRESS }}
        run: |
          for i in $(seq 1 24); do
            STATUS=$(ssh -i ~/.ssh/id_deploy "${REMOTE_USER}@${IP}" \
              "sudo docker ps --filter name=${FRONTEND_CONTAINER_NAME} --format '{{.Status}}'" || true)
            echo "Frontend attempt ${i}/24 — ${STATUS:-<no status>}"
            if echo "$STATUS" | grep -q '(healthy)'; then
              echo "Frontend healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Frontend did not reach (healthy) within 2 minutes."
          ssh -i ~/.ssh/id_deploy "${REMOTE_USER}@${IP}" \
            "sudo docker logs --tail 80 ${FRONTEND_CONTAINER_NAME}" || true
          exit 1
